# codex-delegation project configuration (bash syntax, sourced by the scripts).
# Copy next to your task files and point CDL_CONF at it:
#   export CDL_CONF=/path/to/myrepo-tasks/codex-delegation.conf
# Precedence: values set here, then PRESET defaults, then built-in defaults.

# Main checkout and the branch accepted work is delivered to.
REPO=/path/to/myrepo
BASE_BRANCH=main

# One worktree per task under WT_ROOT; task.md, reports and gate summaries
# under TASKS_ROOT. Keep TASKS_ROOT outside the repository so reports are
# never committed.
WT_ROOT=/path/to/myrepo-wt
TASKS_ROOT=/path/to/myrepo-tasks

# Ecosystem defaults for suppression, skip, failure and test-path patterns:
# python, go, rust, java, javascript or cpp (templates/presets). Empty = generic.
PRESET=python

# Gate list (`name | command`), see gates.example and the preset's suggestions.
GATES_FILE=$TASKS_ROOT/gates.txt

# Optional executable run as `$SETUP_HOOK <worktree>` after checkout, for
# untracked dependencies, submodules or LFS (see setup-worktree.example.sh).
# The fresh worktree must still be clean afterwards.
SETUP_HOOK=

# Refuse a new worktree below this much free disk space (each is a full checkout).
MIN_FREE_GB=3

# Environment applied to every gate; single quotes keep $WT for runtime.
# Example for a Python editable install that points at the main checkout:
# GATE_ENV='PYTHONPATH=$WT/src'
GATE_ENV=

# Sandbox for write modes (implement, refactor, docs). investigate tasks always
# run read-only unless their task.md says otherwise. workspace-write keeps
# writes inside the worktree, blocks network for commands and cannot write the
# shared .git, so Codex cannot commit.
CODEX_SANDBOX=workspace-write
# Extra `codex exec` arguments, for example a cheaper model for small tasks.
CODEX_EXTRA_ARGS=

# Circuit breakers: Codex rounds per task (resume refuses beyond it) and full
# log/diff reads for diagnosis across all tasks (ledger.sh full-read refuses).
MAX_ROUNDS=3
MAX_FULL_READS=3

# Delivery of an accepted commit: ff-merge (fast-forward BASE_BRANCH),
# branch-only (keep it on its branch, e.g. for a pull request; pushing needs
# separate authorization) or patch (write git format-patch files).
DELIVERY=ff-merge

# Report length the protocol allows.
REPORT_MAX_LINES=80

# Pattern overrides; leave commented to use the PRESET values.
# SUPPRESSION_PATTERN=''   # added matches fail acceptance
# SKIP_PATTERN=''          # added matches are flagged for review
# FAIL_PATTERN=''          # failing-gate log lines copied into the summary
# TEST_PATHS=''            # existing tests that refactor mode must not edit
# DOC_PATHS=''             # files docs mode may change

# Optional commit-message checks; {file} and {rev} are substituted, quoted.
# MSG_FILE_CHECK='python -m mypkg.commit_message file {file} --author-name "A" --author-email "a@example.com"'
# MSG_COMMIT_CHECK='python -m mypkg.commit_message commits {rev}'
MSG_FILE_CHECK=
MSG_COMMIT_CHECK=
