# codex-delegation project configuration (bash syntax, sourced by the scripts).
# Copy next to your task files and point CDL_CONF at it:
#   export CDL_CONF=/path/to/myrepo-tasks/codex-delegation.conf
# Precedence: values set here, then PRESET defaults, then built-in defaults.

# Main checkout and the branch accepted work is delivered to.
REPO=/path/to/myrepo
BASE_BRANCH=main

# One worktree per task under WT_ROOT; task.md, reports and gate summaries
# under TASKS_ROOT. Keep TASKS_ROOT outside the repository so reports are
# never committed.
WT_ROOT=/path/to/myrepo-wt
TASKS_ROOT=/path/to/myrepo-tasks

# Ecosystem defaults for suppression, skip, failure and test-path patterns:
# python, go, rust, java, javascript or cpp (templates/presets). Empty = generic.
PRESET=python

# Gate lists (`name | command`), see gates.example, focused.example and the
# preset's suggestions. The full list is the acceptance evidence and runs once
# before a delivery; the focused list (run-gates.sh --focused, pipeline.sh
# --focused) covers intermediate rounds and trial versions. Every gate sees
# CHANGED_FILES, the paths changed against the merge base.
GATES_FILE=$TASKS_ROOT/gates.txt
FOCUSED_GATES_FILE=$TASKS_ROOT/focused.txt

# Optional executable run as `$SETUP_HOOK <worktree>` after checkout, for
# untracked dependencies, submodules or LFS (see setup-worktree.example.sh).
# The fresh worktree must still be clean afterwards.
SETUP_HOOK=

# Refuse a new worktree below this much free disk space (each is a full checkout).
MIN_FREE_GB=3

# Environment applied to every gate; single quotes keep $WT for runtime.
# Example for a Python editable install that points at the main checkout:
# GATE_ENV='PYTHONPATH=$WT/src'
GATE_ENV=

# Sandbox for write modes (implement, refactor, docs). investigate tasks run
# read-only unless their task.md says otherwise; operate tasks name their own.
# Every round runs with approval policy never.
# danger-full-access lets Codex install, build, test and use the network like
# a developer. It needs ALLOW_FULL_ACCESS=yes, which acknowledges that the
# sandbox's guarantees become rules plus checks (SKILL.md, "Permissions"):
#   no commit, branch change or .git edit     the repository guard checks it
#   no change to other checkouts              the repository guard checks it
#   no ssh to real systems (except operate)   common.md; Codex runs without an
#                                             ssh agent and git refuses ssh
#   no writes to ~/.ssh or other home files   common.md only
#   no network for commands                   common.md only
# workspace-write keeps writes inside the worktree and blocks network and
# writes to the shared .git for Codex's commands.
CODEX_SANDBOX=danger-full-access
ALLOW_FULL_ACCESS=yes
# Model and reasoning effort of every round, start and resume alike; empty =
# the Codex configuration's default. When set, each round's log must report
# them, otherwise run-codex.sh warns of model or effort drift; when empty,
# resumed rounds are compared with round 1. doctor.sh --smoke proves the model
# ID with the same arguments.
CODEX_MODEL=
CODEX_EFFORT=
# Further arguments for every round. They are passed to `codex exec` and to
# `codex exec resume`, so use only flags both accept (for example -c
# key=value, --enable, --disable; not -p, --add-dir or --oss). doctor.sh
# checks them. Example: CODEX_EXTRA_ARGS='-c model_verbosity="low"'
CODEX_EXTRA_ARGS=

# Circuit breakers: Codex rounds per task (resume refuses beyond it) and full
# log/diff reads for diagnosis across all tasks (ledger.sh full-read refuses).
MAX_ROUNDS=3
MAX_FULL_READS=3

# Delivery of an accepted commit: ff-merge (fast-forward BASE_BRANCH),
# branch-only (keep it on its branch, e.g. for a pull request; pushing needs
# separate authorization) or patch (write git format-patch files).
DELIVERY=ff-merge

# Report length the protocol allows.
REPORT_MAX_LINES=80

# Pattern overrides; leave commented to use the PRESET values.
# SUPPRESSION_PATTERN=''   # added matches fail acceptance
# SKIP_PATTERN=''          # added matches are flagged for review
# FAIL_PATTERN=''          # failing-gate log lines copied into the summary
# TEST_PATHS=''            # existing tests that refactor mode must not edit
# DOC_PATHS=''             # files docs mode may change

# Optional commit-message checks; {file} and {rev} are substituted, quoted.
# MSG_FILE_CHECK='python -m mypkg.commit_message file {file} --author-name "A" --author-email "a@example.com"'
# MSG_COMMIT_CHECK='python -m mypkg.commit_message commits {rev}'
MSG_FILE_CHECK=
MSG_COMMIT_CHECK=
