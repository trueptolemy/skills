# C/C++ preset (CMake/CTest, GoogleTest): fills only unset values.
# Suggested gates:
#   configure | cmake -S . -B build
#   build     | cmake --build build -j
#   tests     | ctest --test-dir build --output-on-failure
[[ -n ${SUPPRESSION_PATTERN:-} ]] || SUPPRESSION_PATTERN='NOLINT|#pragma (warning|GCC diagnostic|clang diagnostic)|cppcheck-suppress|coverity\['
[[ -n ${SKIP_PATTERN:-} ]] || SKIP_PATTERN='DISABLED_|GTEST_SKIP'
[[ -n ${FAIL_PATTERN:-} ]] || FAIL_PATTERN='^\[  FAILED  \]|The following tests FAILED|^[^ ]+:[0-9]+:[0-9]+: error:'
[[ -n ${TEST_PATHS:-} ]] || TEST_PATHS='(^|/)tests?/|_test\.(c|cc|cpp|cxx)$|_unittest\.(cc|cpp)$'
