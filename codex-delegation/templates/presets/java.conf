# Java/Kotlin preset (Maven or Gradle): fills only unset values.
# Suggested gates:
#   build     | ./mvnw -q -DskipTests verify        (or ./gradlew build -x test)
#   tests     | ./mvnw -q test                        (or ./gradlew test)
[[ -n ${SUPPRESSION_PATTERN:-} ]] || SUPPRESSION_PATTERN='@SuppressWarnings|@Suppress\(|NOPMD|CHECKSTYLE[: ]*OFF|NOSONAR|@SuppressFBWarnings'
[[ -n ${SKIP_PATTERN:-} ]] || SKIP_PATTERN='@Disabled|@Ignore|assumeTrue\('
[[ -n ${FAIL_PATTERN:-} ]] || FAIL_PATTERN='^\[ERROR\]|Tests run:.*(Failures|Errors): [1-9]|FAILED$'
[[ -n ${TEST_PATHS:-} ]] || TEST_PATHS='(^|/)src/test/|Tests?\.(java|kt)$'
