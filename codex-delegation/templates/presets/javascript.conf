# JavaScript/TypeScript preset: fills only unset values.
# Suggested gates:
#   types     | npx tsc --noEmit
#   lint      | npx eslint .
#   tests     | npm test --silent
[[ -n ${SUPPRESSION_PATTERN:-} ]] || SUPPRESSION_PATTERN='eslint-disable|@ts-ignore|@ts-expect-error|@ts-nocheck|istanbul ignore|c8 ignore|v8 ignore'
[[ -n ${SKIP_PATTERN:-} ]] || SKIP_PATTERN='(^|[^A-Za-z0-9_])(it|test|describe)\.(skip|only)\(|(^|[^A-Za-z0-9_])x(it|describe)\('
[[ -n ${FAIL_PATTERN:-} ]] || FAIL_PATTERN='^[[:space:]]*(✕|×|FAIL[[:space:]]|●[[:space:]])|^[[:space:]]+[0-9]+\) '
[[ -n ${TEST_PATHS:-} ]] || TEST_PATHS='(^|/)(__tests__|tests?|spec)/|\.(test|spec)\.[cm]?[jt]sx?$'
