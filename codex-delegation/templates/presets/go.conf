# Go preset: fills only values the project configuration left unset.
# Suggested gates:
#   module    | go list -m
#   format    | test -z "$(gofmt -l .)"
#   vet       | go vet ./...
#   tests     | go test ./...
[[ -n ${SUPPRESSION_PATTERN:-} ]] || SUPPRESSION_PATTERN='//nolint|//lint:ignore|//go:build ignore|// +build ignore'
[[ -n ${SKIP_PATTERN:-} ]] || SKIP_PATTERN='t\.Skip(f|Now)?\('
[[ -n ${FAIL_PATTERN:-} ]] || FAIL_PATTERN='^--- FAIL:|^FAIL[[:space:]]|^panic:'
[[ -n ${TEST_PATHS:-} ]] || TEST_PATHS='_test\.go$|(^|/)testdata/'
