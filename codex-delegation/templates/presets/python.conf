# Python preset: fills only values the project configuration left unset.
# Suggested gates (adapt paths and package name):
#   import-path | python -c 'import mypkg, os, sys; p = os.path.realpath(mypkg.__file__); sys.exit(0 if p.startswith(os.environ["WT"] + "/") else "imported outside worktree: " + p)'
#   lint        | python -m ruff check .
#   format      | python -m ruff format --check .
#   types       | python -m mypy src
#   tests       | python -m pytest -q
# An editable install points at the main checkout: set GATE_ENV='PYTHONPATH=$WT/src'.
[[ -n ${SUPPRESSION_PATTERN:-} ]] || SUPPRESSION_PATTERN='noqa|type: *ignore|pylint: *disable|pragma: *no cover|pyright: *ignore|mypy: *ignore'
[[ -n ${SKIP_PATTERN:-} ]] || SKIP_PATTERN='pytest\.mark\.(skip|xfail)|pytest\.skip\(|unittest\.skip|@skip'
[[ -n ${FAIL_PATTERN:-} ]] || FAIL_PATTERN='^(FAILED|ERROR)[ :]|^E +[A-Za-z]+Error'
[[ -n ${TEST_PATHS:-} ]] || TEST_PATHS='(^|/)tests?/|(^|/)test_[^/]*\.py$|_test\.py$|(^|/)conftest\.py$'
