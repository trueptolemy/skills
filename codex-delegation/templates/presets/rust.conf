# Rust preset: fills only values the project configuration left unset.
# Suggested gates:
#   format    | cargo fmt --check
#   clippy    | cargo clippy --all-targets -- -D warnings
#   tests     | cargo test
# Inline #[cfg(test)] modules live in src/ and cannot be told apart by path.
[[ -n ${SUPPRESSION_PATTERN:-} ]] || SUPPRESSION_PATTERN='#!?\[allow\(|#!?\[cfg_attr\(.*allow'
[[ -n ${SKIP_PATTERN:-} ]] || SKIP_PATTERN='#\[ignore'
[[ -n ${FAIL_PATTERN:-} ]] || FAIL_PATTERN='\.\.\. FAILED$|^error(\[E[0-9]+\])?:|^test result: FAILED'
[[ -n ${TEST_PATHS:-} ]] || TEST_PATHS='(^|/)tests/|(^|/)benches/'
